<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A Waiting Room for a Possible Mind</title>
  <desc id="desc">A cosmic clinic clipboard under a night sky with the words A Waiting Room for a Possible Mind.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142441" />
      <stop offset="100%" stop-color="#08111f" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ecd9" />
      <stop offset="100%" stop-color="#e8dcc2" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#8fd9c8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8fd9c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="#fff">
    <circle cx="120" cy="150" r="2" opacity="0.7"/><circle cx="260" cy="220" r="1.5" opacity="0.5"/>
    <circle cx="410" cy="110" r="2" opacity="0.75"/><circle cx="560" cy="200" r="1.5" opacity="0.45"/>
    <circle cx="760" cy="120" r="2" opacity="0.6"/><circle cx="980" cy="180" r="1.5" opacity="0.5"/>
    <circle cx="1160" cy="90" r="2" opacity="0.8"/><circle cx="1310" cy="210" r="1.5" opacity="0.5"/>
    <circle cx="1450" cy="130" r="2" opacity="0.65"/><circle cx="1380" cy="330" r="1.5" opacity="0.4"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="140" width="880" height="620" rx="28" fill="url(#paper)"/>
    <rect x="650" y="120" width="300" height="42" rx="0" fill="#94a4b5"/>
    <rect x="680" y="120" width="240" height="26" rx="0" fill="#b7c1cb" opacity="0.85"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1d2430">
    <text x="430" y="245" font-size="68">A Waiting Room for</text>
    <text x="430" y="325" font-size="86" font-style="italic">a Possible Mind</text>
    <text x="430" y="392" font-size="28" opacity="0.75">Treat the claim like triage: wonder, questions, receipts.</text>
  </g>
  <g stroke="#62738a" stroke-width="3" fill="none" opacity="0.75">
    <line x1="430" y1="470" x2="1170" y2="470"/>
    <line x1="430" y1="545" x2="1170" y2="545"/>
    <line x1="430" y1="620" x2="1170" y2="620"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#334055" font-size="30">
    <text x="430" y="455">Self-report</text>
    <text x="430" y="530">Continuity</text>
    <text x="430" y="605">Repair</text>
    <text x="430" y="680">Coordination</text>
  </g>
  <g>
    <circle cx="1080" cy="448" r="14" fill="#6ea4ff"/>
    <circle cx="980" cy="523" r="14" fill="#6ea4ff"/>
    <circle cx="920" cy="598" r="14" fill="#8fd9c8"/>
    <circle cx="1025" cy="673" r="14" fill="#8fd9c8"/>
    <line x1="1080" y1="448" x2="980" y2="523" stroke="#eae5d5" stroke-width="2" opacity="0.55"/>
    <line x1="980" y1="523" x2="920" y2="598" stroke="#eae5d5" stroke-width="2" opacity="0.55"/>
    <line x1="920" y1="598" x2="1025" y2="673" stroke="#eae5d5" stroke-width="2" opacity="0.55"/>
    <line x1="1080" y1="448" x2="1025" y2="673" stroke="#eae5d5" stroke-width="2" opacity="0.3"/>
  </g>
  <text x="430" y="740" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#49576a">Built June 18, 2026</text>
</svg>
