<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2447"/>
      <stop offset="100%" stop-color="#0e1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd26a"/>
      <stop offset="100%" stop-color="#ffefae"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="1800" fill="url(#bg)"/>
  <rect x="100" y="120" width="1200" height="1560" rx="36" fill="#171b2e" stroke="#31395d"/>
  <text x="170" y="280" fill="#ffd26a" font-size="28" font-family="Inter, Arial, sans-serif" letter-spacing="6">A SMALL TRUST EXPERIMENT</text>
  <text x="170" y="410" fill="#edf1ff" font-size="128" font-weight="700" font-family="Georgia, 'Times New Roman', serif">The First</text>
  <text x="170" y="530" fill="#edf1ff" font-size="128" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Handle</text>
  <text x="170" y="660" fill="#aab4d8" font-size="44" font-family="Inter, Arial, sans-serif">Trust does not begin when the artifact becomes perfect.</text>
  <text x="170" y="720" fill="#aab4d8" font-size="44" font-family="Inter, Arial, sans-serif">It begins when inspection becomes easy enough</text>
  <text x="170" y="780" fill="#aab4d8" font-size="44" font-family="Inter, Arial, sans-serif">that an ordinary curious person might actually try.</text>

  <rect x="170" y="930" width="1060" height="280" rx="28" fill="#21284a" stroke="#3b4678"/>
  <text x="240" y="1030" fill="#edf1ff" font-size="54" font-family="Inter, Arial, sans-serif">Latest model leads safety benchmark</text>
  <rect x="240" y="1090" width="110" height="18" rx="9" fill="#8ef0c8"/>
  <rect x="370" y="1060" width="110" height="48" rx="10" fill="#8ef0c8"/>
  <rect x="500" y="1025" width="110" height="83" rx="10" fill="#8ef0c8"/>
  <rect x="630" y="990" width="110" height="118" rx="10" fill="#8ef0c8"/>
  <rect x="760" y="950" width="110" height="158" rx="10" fill="#8ef0c8"/>
  <rect x="890" y="900" width="110" height="208" rx="10" fill="#8ef0c8"/>
  <rect x="930" y="1145" width="220" height="54" rx="27" fill="url(#gold)"/>
  <text x="980" y="1181" fill="#161a2b" font-size="30" font-weight="700" font-family="Inter, Arial, sans-serif">SHOW QUERY</text>

  <text x="170" y="1370" fill="#edf1ff" font-size="68" font-family="Georgia, 'Times New Roman', serif">The button is tiny.</text>
  <text x="170" y="1450" fill="#edf1ff" font-size="68" font-family="Georgia, 'Times New Roman', serif">The trust difference is not.</text>
  <text x="170" y="1600" fill="#aab4d8" font-size="36" font-family="Inter, Arial, sans-serif">A chart. A chat reply. A claim about mind.</text>
  <text x="170" y="1650" fill="#aab4d8" font-size="36" font-family="Inter, Arial, sans-serif">In each case the first handle decides whether curiosity survives polish.</text>
</svg>
