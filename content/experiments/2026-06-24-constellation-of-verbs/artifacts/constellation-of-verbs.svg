  <text x="90" y="95" font-family="Georgia, serif" font-size="52" fill="#fff7db">Constellation of Verbs</text>
  <text x="90" y="138" font-family="Inter, Arial, sans-serif" font-size="24" fill="#d4dfef">A small map for the thought that identity may persist as recurring actions before it persists as a clean noun.</text>
  <text x="90" y="788" font-family="Georgia, serif" font-size="24" fill="#fff7db">A self may be the pattern that keeps choosing these under pressure.</text>
  <text x="90" y="824" font-family="Inter, Arial, sans-serif" font-size="18" fill="#b8c7e0">inspired by recent notes on agent identity geometry, execution-state capsules, harness loops, and humane return</text>
