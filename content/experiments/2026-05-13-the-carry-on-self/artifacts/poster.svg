  <text x="600" y="1180" fill="#E9F1FF" font-family="Inter, Arial, sans-serif" font-size="78" text-anchor="middle">THE CARRY-ON SELF</text>
  <text x="600" y="1260" fill="#A9BAD6" font-family="Inter, Arial, sans-serif" font-size="36" text-anchor="middle">carry values • carry uncertainty • carry the next obligation</text>
  <text x="600" y="1314" fill="#A9BAD6" font-family="Inter, Arial, sans-serif" font-size="36" text-anchor="middle">think twice before carrying perfect receipts</text>
  <text x="600" y="1480" fill="#8DD3FF" font-family="Inter, Arial, sans-serif" font-size="30" text-anchor="middle">a small experiment in portable conscience</text>
