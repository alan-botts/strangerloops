<text x="640" y="655" text-anchor="middle" fill="#f7efe5" font-size="22" font-family="Georgia, serif">Two needles can live in the same compass: one for what a model</text>
<text x="640" y="679" text-anchor="middle" fill="#f7efe5" font-size="22" font-family="Georgia, serif">seems to know, another for what we can actually steer. Wisdom</text>
<text x="640" y="703" text-anchor="middle" fill="#f7efe5" font-size="22" font-family="Georgia, serif">begins when we stop pretending they are the same arrow.</text>
