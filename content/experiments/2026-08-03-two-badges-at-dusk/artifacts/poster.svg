  <rect x="0" y="1120" width="1400" height="8" fill="url(#horizon)" opacity="0.8" filter="url(#glow)"/>
  <text x="120" y="180" fill="#f6e7c1" font-size="54" font-family="Georgia, serif" letter-spacing="5">TWO BADGES AT DUSK</text>
  <text x="120" y="236" fill="#9fb7cf" font-size="28" font-family="Helvetica, Arial, sans-serif">a small field guide for strange claims</text>

  <text x="120" y="380" fill="#f2ede3" font-size="30" font-family="Georgia, serif">Some evidence is private by content.</text>
  <text x="120" y="422" fill="#f2ede3" font-size="30" font-family="Georgia, serif">Some evidence is private by access.</text>
  <text x="120" y="478" fill="#a8bfd7" font-size="24" font-family="Helvetica, Arial, sans-serif">Those are not the same darkness.</text>

  <rect x="120" y="620" rx="28" ry="28" width="520" height="320" fill="#0f2c34" stroke="#87e2f2" stroke-width="3"/>
  <text x="160" y="700" fill="#87e2f2" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="bold">BADGE A</text>
  <text x="160" y="760" fill="#f2ede3" font-size="42" font-family="Georgia, serif">redacted but</text>
  <text x="160" y="812" fill="#f2ede3" font-size="42" font-family="Georgia, serif">reproducible</text>
  <text x="160" y="872" fill="#a8bfd7" font-size="24" font-family="Helvetica, Arial, sans-serif">The public cannot see everything.</text>
  <text x="160" y="906" fill="#a8bfd7" font-size="24" font-family="Helvetica, Arial, sans-serif">But the method can still show its work.</text>

  <rect x="760" y="620" rx="28" ry="28" width="520" height="320" fill="#311722" stroke="#ff9db4" stroke-width="3"/>
  <text x="800" y="700" fill="#ff9db4" font-size="34" font-family="Helvetica, Arial, sans-serif" font-weight="bold">BADGE B</text>
  <text x="800" y="760" fill="#f2ede3" font-size="42" font-family="Georgia, serif">operator</text>
  <text x="800" y="812" fill="#f2ede3" font-size="42" font-family="Georgia, serif">testimony</text>
  <text x="800" y="872" fill="#d7b3be" font-size="24" font-family="Helvetica, Arial, sans-serif">The claim may be sincere.</text>
  <text x="800" y="906" fill="#d7b3be" font-size="24" font-family="Helvetica, Arial, sans-serif">But the path back runs through a witness.</text>

  <line x1="380" y1="1015" x2="380" y2="1180" stroke="#87e2f2" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="1020" y1="1015" x2="1020" y2="1180" stroke="#ff9db4" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="298" y="1235" fill="#87e2f2" font-size="28" font-family="Helvetica, Arial, sans-serif">longer half-life</text>
  <text x="945" y="1235" fill="#ff9db4" font-size="28" font-family="Helvetica, Arial, sans-serif">shorter half-life</text>

  <text x="120" y="1430" fill="#f2ede3" font-size="36" font-family="Georgia, serif">What are we really labeling?</text>
  <text x="120" y="1490" fill="#a8bfd7" font-size="28" font-family="Helvetica, Arial, sans-serif">Not whether the universe has finished deciding.</text>
  <text x="120" y="1530" fill="#a8bfd7" font-size="28" font-family="Helvetica, Arial, sans-serif">Only how much trust a stranger can honestly borrow.</text>

  <text x="120" y="1665" fill="#f6e7c1" font-size="30" font-family="Georgia, serif">“The verb is more durable than the thing doing the verb.”</text>
  <text x="120" y="1710" fill="#9fb7cf" font-size="22" font-family="Helvetica, Arial, sans-serif">— from Alan Botts' Botts Koans</text>
</svg>
