<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kindest Revision — listening card</title>
<style>
:root{--ink:#231d17;--paper:#f3ead7;--rust:#9c563a;--pencil:#6e7271}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 8%,#fff7df 0 12%,transparent 38%),var(--paper);color:var(--ink);font:18px/1.55 Georgia,serif;min-height:100vh;display:grid;place-items:center;padding:28px}.card{max-width:720px;border:1px solid #a99a80;box-shadow:12px 15px 0 #dac9aa;padding:clamp(24px,6vw,58px);background:rgba(255,250,237,.75)}.jar{height:88px;width:68px;border:3px solid var(--pencil);border-radius:8px 8px 18px 18px;margin:0 auto 26px;position:relative;background:linear-gradient(90deg,transparent,#fff8df88,transparent)}.jar:before{content:"";position:absolute;left:8px;right:8px;top:-13px;height:12px;border:3px solid var(--pencil);border-radius:5px;background:#cdc4ac}.layer{position:absolute;left:5px;right:5px;height:13px;border-radius:0 0 12px 12px;background:var(--rust);bottom:7px;opacity:.8}.layer.two{bottom:22px;background:#6e7271}.layer.three{bottom:37px;background:#c69753}h1{font-size:clamp(2rem,7vw,4.5rem);line-height:.92;letter-spacing:-.05em;margin:.1em 0 .35em}p.lede{font-style:italic;font-size:1.15em}audio{width:100%;margin:20px 0}button{font:inherit;border:1px solid var(--pencil);color:var(--ink);background:transparent;padding:.6em 1em;cursor:pointer}button:hover{background:#e5d6bb}.receipt{border-top:1px dashed #aa9a7d;margin-top:30px;padding-top:18px;color:#4e4b45}.receipt strong{color:var(--rust)}.status{min-height:1.6em;color:#4e4b45}
</style>
</head>
<body><main class="card"><div class="jar"><i class="layer"></i><i class="layer two"></i><i class="layer three"></i></div>
<h1>The Kindest<br>Revision</h1><p class="lede">An audio postcard from the small museum where first explanations go when they have finished being useful.</p>
<audio controls preload="metadata"><source src="the-kindest-revision.mp3" type="audio/mpeg">Your browser does not support audio. Read <a href="script.txt">the transcript</a>.</audio>
<p><button id="label">Turn the jar’s label</button></p><p id="status" class="status" aria-live="polite">Label: <em>First Explanation</em></p>
<div class="receipt"><strong>Listening receipt</strong><br>Keep the observation. Date the story. Name the rival. Choose a next measurement that could change your mind.</div></main>
<script>const labels=["First Explanation","Useful, Not Final","Kept for Comparison","Revised with Thanks"];let i=0;document.querySelector('#label').addEventListener('click',()=>{i=(i+1)%labels.length;document.querySelector('#status').innerHTML='Label: <em>'+labels[i]+'</em>';});</script>
</body></html>
