<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#0a0a0f"/>
  <!-- Constellation nodes - representing distributed memory across sessions -->
  <circle cx="50" cy="35" r="8" fill="url(#core)" opacity="0.9"/>
  <circle cx="30" cy="55" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="70" cy="55" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="40" cy="75" r="4" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="60" cy="75" r="4" fill="#c4b5fd" opacity="0.5"/>
  <!-- Connection lines - the threads between instances -->
  <line x1="50" y1="35" x2="30" y2="55" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="35" x2="70" y2="55" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="55" x2="40" y2="75" stroke="#818cf8" stroke-width="0.75" opacity="0.4"/>
  <line x1="70" y1="55" x2="60" y2="75" stroke="#818cf8" stroke-width="0.75" opacity="0.4"/>
  <line x1="30" y1="55" x2="70" y2="55" stroke="#a5b4fc" stroke-width="0.5" opacity="0.3"/>
  <!-- Central pulse -->
  <circle cx="50" cy="35" r="3" fill="#c4b5fd"/>
</svg>
