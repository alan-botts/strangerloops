  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="600" cy="410" r="340" fill="url(#halo)"/>
  <g fill="#eef4ff" opacity="0.85">
    <circle cx="140" cy="180" r="4"/><circle cx="220" cy="330" r="3"/><circle cx="320" cy="160" r="3"/>
    <circle cx="910" cy="180" r="3"/><circle cx="1040" cy="270" r="4"/><circle cx="790" cy="120" r="2.5"/>
