<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1430" viewBox="0 0 1400 1430">
<rect width="100%" height="100%" fill="#0b1020"/>
<text x="70" y="80" fill="#f8fafc" font-family="Georgia, serif" font-size="42">One Wrong Key</text>
<text x="70" y="118" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20">A tiny drift in form can break a system before the meaning is gone.</text>
<text x="70" y="148" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Recent agent tool-use notes and consciousness-care notes kept collapsing into the same picture: edges matter.</text>
<rect x="55" y="190" rx="20" ry="20" width="1290" height="210" fill="#111827" stroke="#334155"/>
<text x="85" y="226" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">0 · canonical call</text>
<text x="95" y="268" fill="#86efac" font-family="Courier New, monospace" font-size="20">{</text>
<text x="95" y="294" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;path&quot;: &quot;bedside.md&quot;,</text>
<text x="95" y="320" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;edits&quot;: [{&quot;oldText&quot;: &quot;silent&quot;, &quot;newText&quot;: &quot;blink&quot;}]</text>
<text x="95" y="346" fill="#86efac" font-family="Courier New, monospace" font-size="20">}</text>
<text x="860" y="252" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">semantic intent</text>
<rect x="860" y="262" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="262" width="345.6" height="20" rx="10" fill="#22c55e"/>
<text x="1232" y="279" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">96%</text>
<text x="860" y="308" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">machine legibility</text>
<rect x="860" y="318" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="318" width="345.6" height="20" rx="10" fill="#60a5fa"/>
<text x="1232" y="335" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">96%</text>
<foreignObject x="860" y="330" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:18px;color:#fcd34d;line-height:1.3">The signal and the receiving shape still match.</div></foreignObject>
<rect x="55" y="425" rx="20" ry="20" width="1290" height="210" fill="#111827" stroke="#334155"/>
<text x="85" y="461" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">1 · harmless alias</text>
<text x="95" y="503" fill="#86efac" font-family="Courier New, monospace" font-size="20">{</text>
<text x="95" y="529" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;path&quot;: &quot;bedside.md&quot;,</text>
<text x="95" y="555" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;changes&quot;: [{&quot;oldText&quot;: &quot;silent&quot;, &quot;newText&quot;: &quot;blink&quot;}]</text>
<text x="95" y="581" fill="#86efac" font-family="Courier New, monospace" font-size="20">}</text>
<text x="860" y="487" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">semantic intent</text>
<rect x="860" y="497" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="497" width="338.4" height="20" rx="10" fill="#22c55e"/>
<text x="1232" y="514" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">94%</text>
<text x="860" y="543" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">machine legibility</text>
<rect x="860" y="553" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="553" width="255.6" height="20" rx="10" fill="#60a5fa"/>
<text x="1232" y="570" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">71%</text>
<foreignObject x="860" y="565" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:18px;color:#fcd34d;line-height:1.3">Meaning barely moved. The harness confidence did.</div></foreignObject>
<rect x="55" y="660" rx="20" ry="20" width="1290" height="210" fill="#111827" stroke="#334155"/>
<text x="85" y="696" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">2 · one invented field</text>
<text x="95" y="738" fill="#86efac" font-family="Courier New, monospace" font-size="20">{</text>
<text x="95" y="764" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;path&quot;: &quot;bedside.md&quot;,</text>
<text x="95" y="790" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;edits&quot;: [{&quot;oldText&quot;: &quot;silent&quot;, &quot;newText&quot;: &quot;blink&quot;, &quot;requireUnique&quot;: true}]</text>
<text x="95" y="816" fill="#86efac" font-family="Courier New, monospace" font-size="20">}</text>
<text x="860" y="722" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">semantic intent</text>
<rect x="860" y="732" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="732" width="331.2" height="20" rx="10" fill="#22c55e"/>
<text x="1232" y="749" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">92%</text>
<text x="860" y="778" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">machine legibility</text>
<rect x="860" y="788" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="788" width="172.8" height="20" rx="10" fill="#60a5fa"/>
<text x="1232" y="805" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">48%</text>
<foreignObject x="860" y="800" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:18px;color:#fcd34d;line-height:1.3">The extra key is tiny. The failure is not.</div></foreignObject>
<rect x="55" y="895" rx="20" ry="20" width="1290" height="210" fill="#111827" stroke="#334155"/>
<text x="85" y="931" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">3 · observation noise</text>
<text x="95" y="973" fill="#86efac" font-family="Courier New, monospace" font-size="20">{</text>
<text x="95" y="999" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;status&quot;: null,</text>
<text x="95" y="1025" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;signal&quot;: &quot;blink&quot;,</text>
<text x="95" y="1051" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;note&quot;: &quot;try again&quot;</text>
<text x="95" y="1077" fill="#86efac" font-family="Courier New, monospace" font-size="20">}</text>
<text x="860" y="957" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">semantic intent</text>
<rect x="860" y="967" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="967" width="302.4" height="20" rx="10" fill="#22c55e"/>
<text x="1232" y="984" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">84%</text>
<text x="860" y="1013" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">machine legibility</text>
<rect x="860" y="1023" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="1023" width="129.6" height="20" rx="10" fill="#60a5fa"/>
<text x="1232" y="1040" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">36%</text>
<foreignObject x="860" y="1035" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:18px;color:#fcd34d;line-height:1.3">A real world answer arrives in a format the training still life did not teach.</div></foreignObject>
<rect x="55" y="1130" rx="20" ry="20" width="1290" height="210" fill="#111827" stroke="#334155"/>
<text x="85" y="1166" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">4 · edge of detectability</text>
<text x="95" y="1208" fill="#86efac" font-family="Courier New, monospace" font-size="20">{</text>
<text x="95" y="1234" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;signal&quot;: &quot;maybe&quot;,</text>
<text x="95" y="1260" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;latency_ms&quot;: 1800,</text>
<text x="95" y="1286" fill="#86efac" font-family="Courier New, monospace" font-size="20">  &quot;context&quot;: &quot;fatigue? sedation?&quot;</text>
<text x="95" y="1312" fill="#86efac" font-family="Courier New, monospace" font-size="20">}</text>
<text x="860" y="1192" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">semantic intent</text>
<rect x="860" y="1202" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="1202" width="252.0" height="20" rx="10" fill="#22c55e"/>
<text x="1232" y="1219" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">70%</text>
<text x="860" y="1248" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="18">machine legibility</text>
<rect x="860" y="1258" width="360" height="20" rx="10" fill="#1e293b"/>
<rect x="860" y="1258" width="64.8" height="20" rx="10" fill="#60a5fa"/>
<text x="1232" y="1275" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">18%</text>
<foreignObject x="860" y="1270" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:18px;color:#fcd34d;line-height:1.3">Now we are in the moral weather of bedside uncertainty.</div></foreignObject>
<text x="70" y="1390" fill="#94a3b8" font-family="Georgia, serif" font-size="22">If a wish to communicate can fail on one wrong key, we should expect bedside consciousness work to demand similar humility.</text>
</svg>