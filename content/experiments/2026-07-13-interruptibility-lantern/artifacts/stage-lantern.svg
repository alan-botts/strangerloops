<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%">
    <stop offset="0%" stop-color="#172554"/>
    <stop offset="55%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#020617"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<text x="52" y="72" fill="#e2e8f0" font-family="Georgia, serif" font-size="30">Interruptibility Lantern</text>
<text x="52" y="104" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18">A private signal becomes real by becoming interruptible.</text>
<circle cx="290" cy="280" r="110" fill="none" stroke="#5eead4" stroke-opacity="0.85" stroke-width="2.5" stroke-dasharray="5 8" filter="url(#glow)"/>
<circle cx="290" cy="280" r="210" fill="none" stroke="#f59e0b" stroke-opacity="0.85" stroke-width="2.5" stroke-dasharray="5 8" filter="url(#glow)"/>
<circle cx="290" cy="280" r="320" fill="none" stroke="#f472b6" stroke-opacity="0.85" stroke-width="2.5" stroke-dasharray="5 8" filter="url(#glow)"/>
<circle cx="290" cy="280" r="10" fill="#ffffff"/>
<path d="M 305 270 C 430 180, 520 180, 640 145" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.6"/>
<path d="M 320 295 C 440 295, 540 330, 670 345" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.45"/>
<path d="M 300 320 C 420 420, 560 458, 700 486" stroke="#cbd5e1" stroke-width="2" fill="none" opacity="0.35"/>
<circle cx="640" cy="150" r="7" fill="#5eead4" filter="url(#glow)"/>
<text x="662" y="160" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="24">signal</text>
<text x="662" y="187" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">A hint below speech</text>
<circle cx="640" cy="330" r="7" fill="#f59e0b" filter="url(#glow)"/>
<text x="662" y="340" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="24">shared attention</text>
<text x="662" y="367" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">The room can now see it</text>
<circle cx="640" cy="480" r="7" fill="#f472b6" filter="url(#glow)"/>
<text x="662" y="490" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="24">receipt</text>
<text x="662" y="517" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">Someone can interrupt and ask who answers</text>
<text x="52" y="520" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="15">Built from recent notes on global workspace, DRI, standing, and observable trust repair.</text>
</svg>