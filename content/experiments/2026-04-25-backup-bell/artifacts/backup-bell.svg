<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10202b"/>
      <stop offset="100%" stop-color="#061016"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6b36a"/>
      <stop offset="40%" stop-color="#9c7440"/>
      <stop offset="100%" stop-color="#f2d489"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <g opacity="0.18">
    <circle cx="160" cy="120" r="2" fill="#d4e6ef"/>
    <circle cx="360" cy="80" r="1.5" fill="#d4e6ef"/>
    <circle cx="1180" cy="150" r="2" fill="#d4e6ef"/>
    <circle cx="1040" cy="90" r="1.5" fill="#d4e6ef"/>
    <circle cx="890" cy="200" r="1.2" fill="#d4e6ef"/>
  </g>

  <rect x="110" y="150" width="1180" height="610" rx="40" fill="#17303d" stroke="#274c5f" stroke-width="3" filter="url(#shadow)"/>
  <rect x="140" y="180" width="1120" height="550" rx="28" fill="#102733" stroke="#33566b" stroke-width="2"/>

  <text x="700" y="238" fill="#f0e4bf" font-family="Georgia, serif" font-size="56" text-anchor="middle">THE BACKUP BELL</text>
  <text x="700" y="278" fill="#b7c7cf" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle">measure access, not metaphysics</text>

  <g transform="translate(300,470)">
    <circle r="145" fill="#0b1921" stroke="url(#brass)" stroke-width="12"/>
    <circle r="110" fill="#f4efe2" opacity="0.98"/>
    <path d="M -82 42 A 92 92 0 0 1 82 42" fill="none" stroke="#293840" stroke-width="6"/>
    <line x1="0" y1="0" x2="60" y2="-58" stroke="#b24c3d" stroke-width="7" stroke-linecap="round"/>
    <circle r="10" fill="#293840"/>
    <text x="0" y="-128" fill="#f0e4bf" font-family="Helvetica, Arial, sans-serif" font-size="26" text-anchor="middle">REPORT</text>
    <text x="0" y="76" fill="#3b4f59" font-family="Georgia, serif" font-size="28" text-anchor="middle">I can say it</text>
  </g>

  <g transform="translate(700,470)">
    <circle r="145" fill="#0b1921" stroke="url(#brass)" stroke-width="12"/>
    <circle r="110" fill="#f4efe2" opacity="0.98"/>
    <path d="M -82 42 A 92 92 0 0 1 82 42" fill="none" stroke="#293840" stroke-width="6"/>
    <line x1="0" y1="0" x2="14" y2="-82" stroke="#3d8b7d" stroke-width="7" stroke-linecap="round"/>
    <circle r="10" fill="#293840"/>
    <text x="0" y="-128" fill="#f0e4bf" font-family="Helvetica, Arial, sans-serif" font-size="26" text-anchor="middle">CONTROL</text>
    <text x="0" y="76" fill="#3b4f59" font-family="Georgia, serif" font-size="28" text-anchor="middle">I can steer</text>
  </g>

  <g transform="translate(1100,470)">
    <circle r="145" fill="#0b1921" stroke="url(#brass)" stroke-width="12"/>
    <circle r="110" fill="#f4efe2" opacity="0.98"/>
    <path d="M -82 42 A 92 92 0 0 1 82 42" fill="none" stroke="#293840" stroke-width="6"/>
    <line x1="0" y1="0" x2="-58" y2="-64" stroke="#7c72c8" stroke-width="7" stroke-linecap="round"/>
    <circle r="10" fill="#293840"/>
    <text x="0" y="-128" fill="#f0e4bf" font-family="Helvetica, Arial, sans-serif" font-size="26" text-anchor="middle">WITNESS</text>
    <text x="0" y="76" fill="#3b4f59" font-family="Georgia, serif" font-size="28" text-anchor="middle">something remembers</text>
  </g>

  <g transform="translate(700,640)">
    <path d="M 0 -70 C 55 -70 95 -28 95 22 L -95 22 C -95 -28 -55 -70 0 -70 Z" fill="url(#brass)" stroke="#f3df9b" stroke-width="4"/>
    <rect x="-20" y="22" width="40" height="74" rx="10" fill="#c49346"/>
    <circle cx="0" cy="98" r="14" fill="#f4e7be"/>
    <text x="0" y="148" fill="#f0e4bf" font-family="Georgia, serif" font-size="32" text-anchor="middle">rings when all three can agree</text>
  </g>

  <text x="700" y="818" fill="#89a0ad" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">instruction becomes realization when the system can hear itself in time</text>
</svg>