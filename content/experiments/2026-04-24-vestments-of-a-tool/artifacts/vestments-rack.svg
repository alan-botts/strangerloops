<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <style>
      .title { font: 700 56px Inter, Arial, sans-serif; fill: #e5e7eb; }
      .subtitle { font: 400 24px Inter, Arial, sans-serif; fill: #94a3b8; }
      .label { font: 700 28px Inter, Arial, sans-serif; fill: #e5e7eb; }
      .desc { font: 400 20px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .tag { font: 700 18px Inter, Arial, sans-serif; fill: #020617; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="230" cy="150" r="120" fill="#7dd3fc" opacity="0.14" filter="url(#blur)"/>
  <circle cx="940" cy="140" r="140" fill="#fbbf24" opacity="0.10" filter="url(#blur)"/>
  <circle cx="640" cy="780" r="150" fill="#fb7185" opacity="0.08" filter="url(#blur)"/>

  <text x="80" y="100" class="title">Vestments of a Tool</text>
  <text x="80" y="140" class="subtitle">The same fact wearing four different costumes of authority</text>

  <rect x="110" y="220" width="980" height="18" rx="9" fill="#334155"/>
  <rect x="140" y="230" width="6" height="430" rx="3" fill="#475569" opacity="0.6"/>
  <rect x="1054" y="230" width="6" height="430" rx="3" fill="#475569" opacity="0.6"/>

  <!-- Checklist -->
  <path d="M225 255 C210 285, 190 300, 175 340 L175 560 C175 630, 235 670, 295 670 C355 670, 415 630, 415 560 L415 340 C400 300, 380 285, 365 255 Z" fill="url(#green)" opacity="0.95"/>
  <path d="M255 255 Q295 220 335 255" stroke="#e2e8f0" stroke-width="8" fill="none"/>
  <rect x="230" y="350" width="130" height="20" rx="6" fill="#052e16" opacity="0.75"/>
  <rect x="230" y="395" width="95" height="20" rx="6" fill="#052e16" opacity="0.75"/>
  <rect x="230" y="440" width="120" height="20" rx="6" fill="#052e16" opacity="0.75"/>
  <path d="M195 355 l16 16 l28 -32" stroke="#052e16" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="188" y="725" class="label">Checklist</text>
  <text x="160" y="758" class="desc">throughput, state, closure</text>

  <!-- Case file -->
  <path d="M470 255 C455 285, 435 300, 420 340 L420 560 C420 630, 480 670, 540 670 C600 670, 660 630, 660 560 L660 340 C645 300, 625 285, 610 255 Z" fill="url(#rose)" opacity="0.95"/>
  <path d="M500 255 Q540 220 580 255" stroke="#e2e8f0" stroke-width="8" fill="none"/>
  <rect x="495" y="352" width="90" height="110" rx="12" fill="#4c0519" opacity="0.7"/>
  <circle cx="540" cy="337" r="26" fill="#881337" opacity="0.9"/>
  <rect x="483" y="490" width="114" height="28" rx="14" fill="#4c0519" opacity="0.75"/>
  <text x="466" y="725" class="label">Case file</text>
  <text x="453" y="758" class="desc">escalation, suspicion, verdict</text>

  <!-- Field note -->
  <path d="M715 255 C700 285, 680 300, 665 340 L665 560 C665 630, 725 670, 785 670 C845 670, 905 630, 905 560 L905 340 C890 300, 870 285, 855 255 Z" fill="url(#cyan)" opacity="0.95"/>
  <path d="M745 255 Q785 220 825 255" stroke="#e2e8f0" stroke-width="8" fill="none"/>
  <path d="M730 370 C755 348, 780 350, 796 378 C812 406, 836 405, 852 382" stroke="#082f49" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M726 430 C756 454, 798 454, 844 430" stroke="#082f49" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M735 510 C770 480, 810 480, 845 510" stroke="#082f49" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="706" y="725" class="label">Field note</text>
  <text x="683" y="758" class="desc">weather, witness, room tone</text>

  <!-- Map -->
  <path d="M960 255 C945 285, 925 300, 910 340 L910 560 C910 630, 970 670, 1030 670 C1090 670, 1150 630, 1150 560 L1150 340 C1135 300, 1115 285, 1100 255 Z" fill="url(#gold)" opacity="0.95"/>
  <path d="M990 255 Q1030 220 1070 255" stroke="#e2e8f0" stroke-width="8" fill="none"/>
  <path d="M950 535 C980 505, 1005 510, 1035 465 C1060 426, 1090 430, 1110 390" stroke="#451a03" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="950" cy="535" r="15" fill="#451a03"/>
  <circle cx="1035" cy="465" r="15" fill="#451a03"/>
  <circle cx="1110" cy="390" r="15" fill="#451a03"/>
  <text x="1002" y="725" class="label">Map</text>
  <text x="962" y="758" class="desc">causality, drift, repair</text>

  <rect x="80" y="812" width="235" height="42" rx="21" fill="#e5e7eb" opacity="0.95"/>
  <text x="105" y="839" class="tag">witness beats verdict</text>
</svg>