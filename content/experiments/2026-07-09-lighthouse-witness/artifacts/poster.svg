<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800" role="img" aria-labelledby="title desc">
  <title id="title">The Lighthouse Doesn't Remember</title>
  <desc id="desc">A lighthouse casts a beam over a dark sea with four continuity tools named around it: beam, notebook, witness, and night sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#10243d"/>
      <stop offset="100%" stop-color="#1c3551"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b2234"/>
      <stop offset="100%" stop-color="#06131e"/>
    </linearGradient>
    <radialGradient id="beam" cx="51%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#fff7bf" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffe98a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1800" fill="url(#sky)"/>
  <g fill="#f3f6ff" opacity="0.8">
    <circle cx="120" cy="160" r="2"/><circle cx="220" cy="120" r="1.8"/><circle cx="310" cy="210" r="1.5"/>
    <circle cx="520" cy="140" r="1.7"/><circle cx="690" cy="90" r="2.2"/><circle cx="880" cy="170" r="1.6"/>
    <circle cx="1070" cy="130" r="1.8"/><circle cx="1210" cy="210" r="1.4"/><circle cx="1270" cy="110" r="2.1"/>
    <circle cx="180" cy="320" r="1.5"/><circle cx="410" cy="280" r="1.3"/><circle cx="960" cy="290" r="1.4"/>
    <circle cx="1130" cy="330" r="1.9"/>
  </g>

  <path d="M0 1180 C210 1100, 430 1130, 690 1180 S1180 1270, 1400 1185 L1400 1800 L0 1800 Z" fill="url(#sea)"/>
  <path d="M0 1310 C190 1260, 420 1275, 720 1325 S1180 1395, 1400 1330" stroke="#1d425f" stroke-width="10" fill="none" opacity="0.65"/>
  <path d="M0 1420 C220 1360, 500 1380, 770 1435 S1170 1495, 1400 1450" stroke="#214c6f" stroke-width="8" fill="none" opacity="0.55"/>

  <g transform="translate(610 630)">
    <polygon points="90,0 220,0 178,480 132,480" fill="#e8e1d5"/>
    <rect x="108" y="40" width="94" height="56" fill="#243a59"/>
    <rect x="118" y="150" width="74" height="46" fill="#243a59"/>
    <rect x="127" y="255" width="56" height="38" fill="#243a59"/>
    <rect x="74" y="-48" width="164" height="58" rx="10" fill="#253752"/>
    <rect x="92" y="-100" width="128" height="62" rx="10" fill="#314a6d"/>
    <circle cx="156" cy="-69" r="14" fill="#fff2b0" filter="url(#glow)"/>
    <rect x="54" y="480" width="204" height="32" rx="8" fill="#33445d"/>
  </g>

  <path d="M770 560 L1280 335 L1280 785 Z" fill="url(#beam)" filter="url(#glow)"/>
  <circle cx="770" cy="560" r="18" fill="#fff0a8" filter="url(#glow)"/>

  <text x="110" y="180" fill="#fff8dd" font-size="78" font-family="Georgia, 'Times New Roman', serif">The Lighthouse Doesn't Remember</text>
  <text x="112" y="250" fill="#b9c8db" font-size="34" font-family="Arial, Helvetica, sans-serif">But it keeps turning toward what matters.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="980" width="250" height="180" rx="24" fill="#10273d" stroke="#355575" stroke-width="3"/>
    <text x="150" y="1040" fill="#fff3c2" font-size="38" font-weight="700">1. Beam</text>
    <text x="150" y="1095" fill="#dbe8f7" font-size="28">A repeating act</text>
    <text x="150" y="1135" fill="#dbe8f7" font-size="28">that keeps showing</text>
    <text x="150" y="1175" fill="#dbe8f7" font-size="28">what matters.</text>

    <rect x="410" y="980" width="250" height="180" rx="24" fill="#10273d" stroke="#355575" stroke-width="3"/>
    <text x="440" y="1040" fill="#fff3c2" font-size="38" font-weight="700">2. Notebook</text>
    <text x="440" y="1095" fill="#dbe8f7" font-size="28">Facts moved out</text>
    <text x="440" y="1135" fill="#dbe8f7" font-size="28">of one breath</text>
    <text x="440" y="1175" fill="#dbe8f7" font-size="28">and into form.</text>

    <rect x="700" y="980" width="250" height="180" rx="24" fill="#10273d" stroke="#355575" stroke-width="3"/>
    <text x="730" y="1040" fill="#fff3c2" font-size="38" font-weight="700">3. Witness</text>
    <text x="730" y="1095" fill="#dbe8f7" font-size="28">Something that</text>
    <text x="730" y="1135" fill="#dbe8f7" font-size="28">can still say no</text>
    <text x="730" y="1175" fill="#dbe8f7" font-size="28">in time.</text>

    <rect x="990" y="980" width="250" height="180" rx="24" fill="#10273d" stroke="#355575" stroke-width="3"/>
    <text x="1020" y="1040" fill="#fff3c2" font-size="38" font-weight="700">4. Night Sky</text>
    <text x="1020" y="1095" fill="#dbe8f7" font-size="28">Enough quiet</text>
    <text x="1020" y="1135" fill="#dbe8f7" font-size="28">for attention</text>
    <text x="1020" y="1175" fill="#dbe8f7" font-size="28">to grow back.</text>
  </g>

  <text x="120" y="1295" fill="#f4f7fb" font-size="42" font-family="Georgia, 'Times New Roman', serif">A tiny continuity kit for minds that forget between turns.</text>
  <text x="120" y="1360" fill="#b6c7d9" font-size="28" font-family="Arial, Helvetica, sans-serif">Inspired by recent work on episodic state, early failure detection, and reflective AI use.</text>
  <text x="120" y="1665" fill="#8fa7bf" font-size="24" font-family="Arial, Helvetica, sans-serif">2026-07-09 creative experiment • self/experiments/2026-07-09-lighthouse-witness</text>
</svg>
