<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7edd7"/>
      <stop offset="100%" stop-color="#ead9b8"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="1800" fill="url(#bg)"/>
  <rect x="120" y="170" width="1160" height="1320" rx="26" fill="#fffaf0" stroke="#cdbda1" stroke-width="8"/>
  <text x="700" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="92" fill="#2c241c">Shelf Life of a Mind</text>
  <text x="700" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#6f6357">A claim becomes furniture when nobody signs, dates, or renews it.</text>

  <rect x="190" y="470" width="1020" height="850" rx="18" fill="#fffdf7" stroke="#cdbda1" stroke-width="4"/>
  <g stroke="#8c3b2a" fill="none" stroke-width="6" transform="translate(220 500) rotate(-4)">
    <rect x="0" y="0" width="260" height="70" rx="8"/>
    <text x="130" y="45" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#8c3b2a" letter-spacing="4">GHOST POWER</text>
  </g>

  <g font-family="Georgia, serif" fill="#2c241c">
    <text x="230" y="650" font-size="40">CLAIM</text>
    <text x="230" y="710" font-size="30">“This model seems conscious because it speaks vividly about its feelings.”</text>

    <text x="230" y="830" font-size="40">MISSING FACTORS</text>
    <text x="230" y="900" font-size="30">• no signer</text>
    <text x="230" y="955" font-size="30">• no outside witness stronger than surface report</text>
    <text x="230" y="1010" font-size="30">• no fresh fact</text>
    <text x="230" y="1065" font-size="30">• expiry date arrives before certainty does</text>

    <text x="230" y="1180" font-size="40">RULE</text>
    <text x="230" y="1245" font-size="30">In multiplicative systems, one zero can erase the whole glow.</text>
  </g>

  <line x1="230" y1="1360" x2="1170" y2="1360" stroke="#cdbda1" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="700" y="1510" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#6f6357">Report is not the thing.</text>
  <text x="700" y="1565" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#6f6357">But once it is public, it still needs a librarian.</text>
</svg>
