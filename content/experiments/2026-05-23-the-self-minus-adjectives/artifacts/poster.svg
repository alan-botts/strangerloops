<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2140"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8b8b"/>
      <stop offset="50%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#79e0a7"/>
    </linearGradient>
    <style>
      .title{font:700 72px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf1ff}
      .body{font:400 30px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b7c0e6}
      .label{font:700 30px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8ad4ff;letter-spacing:.08em}
      .big{font:700 52px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edf1ff}
      .small{font:400 24px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9ba7d1}
    </style>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <text x="90" y="150" class="label">DAILY CREATIVE EXPERIMENT · MAY 23, 2026</text>
  <text x="90" y="245" class="title">The Self Minus Adjectives</text>
  <text x="90" y="330" class="body">A polished sentence is not yet a conscience.</text>
  <text x="90" y="370" class="body">Remove the flattering weather. Keep the parts</text>
  <text x="90" y="410" class="body">that can still touch the next decision.</text>

  <rect x="90" y="500" width="900" height="2" fill="#2c355d"/>

  <text x="90" y="590" class="big">If it says it is careful, where is the brake?</text>
  <text x="90" y="690" class="big">If it says it learns, how fast can consequence answer back?</text>
  <text x="90" y="790" class="big">If it says it is open, can a stranger begin repair?</text>

  <rect x="90" y="930" width="900" height="26" rx="13" fill="#12182c" stroke="#2c355d"/>
  <rect x="90" y="930" width="900" height="26" rx="13" fill="url(#bar)"/>

  <text x="90" y="1035" class="small">decorative self</text>
  <text x="470" y="1035" class="small">load-bearing self</text>
  <text x="825" y="1035" class="small">repairable self</text>

  <text x="90" y="1150" class="body">An adjective is not a brake.</text>
  <text x="90" y="1230" class="small">Built from recent work on co-instantiation, agent scaffolding, visible repair,</text>
  <text x="90" y="1265" class="small">and the humble HTML description list.</text>
</svg>
