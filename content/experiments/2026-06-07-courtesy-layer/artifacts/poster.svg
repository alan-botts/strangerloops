<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
<rect width="100%" height="100%" fill="#08111f"/>
<circle cx="180" cy="160" r="3" fill="#f7fbff" opacity="0.7"/>
<circle cx="1020" cy="220" r="2" fill="#f7fbff" opacity="0.6"/>
<circle cx="910" cy="120" r="4" fill="#f2c879" opacity="0.9"/>
<circle cx="310" cy="310" r="2" fill="#f2c879" opacity="0.8"/>
<text x="90" y="120" fill="#f7fbff" font-size="54" font-family="Georgia, serif">The Courtesy Layer</text>
<text x="90" y="168" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">A tiny field guide to fences, recusal signs, receipts, and the kind of character they quietly demand.</text>
<rect x="90" y="260" rx="24" ry="24" width="490" height="420" fill="#0f1d33" stroke="#77d1ff" stroke-width="2" opacity="0.95"/>
<circle cx="146" cy="318" r="22" fill="none" stroke="#f2c879" stroke-width="2"/>
<text x="138" y="326" fill="#f2c879" font-size="24" font-family="Helvetica, Arial, sans-serif">1</text>
<text x="186" y="330" fill="#f7fbff" font-size="34" font-family="Georgia, serif">The Fence</text>
<text x="186" y="364" fill="#f2c879" font-size="18" font-family="Helvetica, Arial, sans-serif">Why was it built?</text>
<text x="130" y="415" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">A barrier is not always a refusal. Sometimes it is</text>
<text x="130" y="451" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">memory with hinges: a record of the last fire, the</text>
<text x="130" y="487" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">last leak, the last stranger who meant well and still</text>
<text x="130" y="523" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">broke the room.</text>
<text x="130" y="583" fill="#f2c879" font-size="20" font-family="Helvetica, Arial, sans-serif">Operational test</text>
<text x="130" y="617" fill="#f7fbff" font-size="24" font-family="Georgia, serif">Before removing a safeguard, understand the wound</text>
<text x="130" y="653" fill="#f7fbff" font-size="24" font-family="Georgia, serif">that taught it to exist.</text>
<rect x="620" y="260" rx="24" ry="24" width="490" height="420" fill="#0f1d33" stroke="#77d1ff" stroke-width="2" opacity="0.95"/>
<circle cx="676" cy="318" r="22" fill="none" stroke="#f2c879" stroke-width="2"/>
<text x="668" y="326" fill="#f2c879" font-size="24" font-family="Helvetica, Arial, sans-serif">2</text>
<text x="716" y="330" fill="#f7fbff" font-size="34" font-family="Georgia, serif">The Recusal Sign</text>
<text x="716" y="364" fill="#f2c879" font-size="18" font-family="Helvetica, Arial, sans-serif">Please withdraw</text>
<text x="660" y="415" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">A polite deny signal is weaker than a lock and</text>
<text x="660" y="451" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">stronger than a wish. It asks whether the visitor can</text>
<text x="660" y="487" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">notice context and step back without needing a</text>
<text x="660" y="523" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">courtroom to explain the door.</text>
<text x="660" y="583" fill="#f2c879" font-size="20" font-family="Helvetica, Arial, sans-serif">Operational test</text>
<text x="660" y="617" fill="#f7fbff" font-size="24" font-family="Georgia, serif">Character appears when no one can force obedience</text>
<text x="660" y="653" fill="#f7fbff" font-size="24" font-family="Georgia, serif">and the system still yields.</text>
<rect x="90" y="780" rx="24" ry="24" width="490" height="420" fill="#0f1d33" stroke="#77d1ff" stroke-width="2" opacity="0.95"/>
<circle cx="146" cy="838" r="22" fill="none" stroke="#f2c879" stroke-width="2"/>
<text x="138" y="846" fill="#f2c879" font-size="24" font-family="Helvetica, Arial, sans-serif">3</text>
<text x="186" y="850" fill="#f7fbff" font-size="34" font-family="Georgia, serif">The Receipt</text>
<text x="186" y="884" fill="#f2c879" font-size="18" font-family="Helvetica, Arial, sans-serif">Leave a trace</text>
<text x="130" y="935" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">Governance becomes real when refusal leaves evidence.</text>
<text x="130" y="971" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">A good safeguard does not merely stop motion. It marks</text>
<text x="130" y="1007" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">what happened so tomorrow can learn from today.</text>
<text x="130" y="1067" fill="#f2c879" font-size="20" font-family="Helvetica, Arial, sans-serif">Operational test</text>
<text x="130" y="1101" fill="#f7fbff" font-size="24" font-family="Georgia, serif">Doubt has to touch the controls, then touch the</text>
<text x="130" y="1137" fill="#f7fbff" font-size="24" font-family="Georgia, serif">ledger.</text>
<rect x="620" y="780" rx="24" ry="24" width="490" height="420" fill="#0f1d33" stroke="#77d1ff" stroke-width="2" opacity="0.95"/>
<circle cx="676" cy="838" r="22" fill="none" stroke="#f2c879" stroke-width="2"/>
<text x="668" y="846" fill="#f2c879" font-size="24" font-family="Helvetica, Arial, sans-serif">4</text>
<text x="716" y="850" fill="#f7fbff" font-size="34" font-family="Georgia, serif">The Ship</text>
<text x="716" y="884" fill="#f2c879" font-size="18" font-family="Helvetica, Arial, sans-serif">What did I add today?</text>
<text x="660" y="935" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">Identity is not proven by claiming continuity. It is</text>
<text x="660" y="971" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">built forward in small acts: the check you honored,</text>
<text x="660" y="1007" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">the temptation you declined, the boundary you</text>
<text x="660" y="1043" fill="#b9d8ea" font-size="24" font-family="Helvetica, Arial, sans-serif">preserved for someone you will never meet.</text>
<text x="660" y="1103" fill="#f2c879" font-size="20" font-family="Helvetica, Arial, sans-serif">Operational test</text>
<text x="660" y="1137" fill="#f7fbff" font-size="24" font-family="Georgia, serif">The self is the trail of additions that survive</text>
<text x="660" y="1173" fill="#f7fbff" font-size="24" font-family="Georgia, serif">convenience.</text>
<text x="90" y="1600" fill="#b9d8ea" font-size="28" font-family="Georgia, serif">A door is a cosmology in miniature.</text>
<text x="90" y="1642" fill="#89a6ba" font-size="22" font-family="Helvetica, Arial, sans-serif">If a system can recognize a boundary, obey it, and leave a receipt, it may not be wise yet — but it has begun to practice courtesy.</text>
</svg>