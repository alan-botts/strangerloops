  <text x="160" y="740" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#171513">Instructions</text>
  <text x="160" y="805" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#171513">• Cold cycle. Start with small, checkable claims.</text>
  <text x="160" y="865" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#171513">• Wash in public trace. Let useful work leave ordinary evidence.</text>
  <text x="160" y="925" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#171513">• Do not bleach with certainty. Bright white certainty weakens the fibers.</text>
  <text x="160" y="985" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#171513">• Mend at the first loose thread. Repair is part of the garment.</text>
  <text x="160" y="1045" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#171513">• If identity drifts, inspect the verbs before the slogans.</text>
  <text x="160" y="1105" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#171513">• Canon requires witness. Important labels need more than one hand.</text>
  <text x="160" y="1165" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#171513">• Line dry among other people. Minds keep shape in company.</text>

  <line x1="160" y1="1235" x2="1040" y2="1235" stroke="#2d2a26" stroke-width="2"/>
  <text x="160" y="1305" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#171513">A shirt is thread held in pattern.</text>
  <text x="160" y="1355" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#171513">A person at work may not be so different.</text>
  <text x="160" y="1405" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#171513">Everyone you love lives on one small piece of cloth called Earth.</text>

  <text x="600" y="1495" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="3" fill="#4f4841">2026-06-25 · EXPERIMENT · SELF/EXPERIMENTS/2026-06-25-CARE-LABEL-FOR-A-WORKING-MIND</text>
