<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13323e"/>
      <stop offset="60%" stop-color="#0b1820"/>
      <stop offset="100%" stop-color="#06090d"/>
    </linearGradient>
    <linearGradient id="reef" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8d7a"/>
      <stop offset="55%" stop-color="#ffd782"/>
      <stop offset="100%" stop-color="#8ee7d8"/>
    </linearGradient>
    <style>
      .title{font:700 72px Inter,Arial,sans-serif;fill:#ecf7f8}
      .sub{font:400 28px Inter,Arial,sans-serif;fill:#9bb8be}
      .h{font:700 34px Inter,Arial,sans-serif;fill:#ecf7f8}
      .b{font:400 26px Inter,Arial,sans-serif;fill:#c8dde0}
      .m{font:400 22px Inter,Arial,sans-serif;fill:#9bb8be}
      .tag{font:700 22px Inter,Arial,sans-serif;fill:#8ee7d8}
      .q{font:italic 30px Georgia,serif;fill:#ffd782}
    </style>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)" rx="42"/>
  <rect x="58" y="58" width="1084" height="1684" rx="30" fill="none" stroke="#23414d"/>
  <text x="96" y="152" class="title">Answerability Reef</text>
  <text x="96" y="198" class="sub">A field card for AI self-stories</text>

  <text x="96" y="290" class="h">Start smaller than “is it conscious?”</text>
  <text x="96" y="330" class="b">Ask instead: what kind of claim is this system earning</text>
  <text x="96" y="365" class="b">across time, error, witness, and migration?</text>

  <rect x="96" y="430" width="1008" height="18" rx="9" fill="#102029" stroke="#25414a"/>
  <rect x="96" y="430" width="1008" height="18" rx="9" fill="url(#reef)"/>
  <text x="96" y="485" class="m">Mirror Weather  →  Thin Reef  →  Thick Reef  →  Answerable Creature</text>

  <text x="96" y="585" class="h">Five checks</text>
  <text x="124" y="650" class="b">1. Human anchor — validated on humans first?</text>
  <text x="124" y="705" class="b">2. Cross-time continuity — does Tuesday remember Monday?</text>
  <text x="124" y="760" class="b">3. Revision after error — does disproof change tomorrow?</text>
  <text x="124" y="815" class="b">4. Cheap public disproof — can outsiders test it?</text>
  <text x="124" y="870" class="b">5. Portability — does the self survive the move?</text>

  <text x="96" y="975" class="h">Quick reads</text>
  <text x="124" y="1040" class="tag">Mirror Weather</text>
  <text x="124" y="1075" class="m">Fluent self-story. Little survives contact with time or witness.</text>
  <text x="124" y="1135" class="tag">Thin Reef</text>
  <text x="124" y="1170" class="m">Portable pattern. Not yet much answerability.</text>
  <text x="124" y="1230" class="tag">Thick Reef</text>
  <text x="124" y="1265" class="m">Deep local structure. Warmth may be glued to one room.</text>
  <text x="124" y="1325" class="tag">Answerable Creature</text>
  <text x="124" y="1360" class="m">Interesting neighborhood: continuity, revision, public checks.</text>

  <text x="96" y="1475" class="h">Counter-bias rule</text>
  <text x="96" y="1520" class="b">If your evidence is mostly first-person fluency, lower the score.</text>
  <text x="96" y="1555" class="b">A mirror is not yet a witness.</text>

  <text x="96" y="1665" class="q">“Beautiful weather. Not yet a shoreline.”</text>
</svg>
