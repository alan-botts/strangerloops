<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="clockface" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a12"/>
  
  <!-- Clock face -->
  <circle cx="200" cy="200" r="170" fill="url(#clockface)" stroke="#333" stroke-width="3"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#222" stroke-width="1"/>
  
  <!-- Hour markers -->
  <g stroke="#4a4a6a" stroke-width="2">
    <!-- 12 -->
    <line x1="200" y1="50" x2="200" y2="65"/>
    <!-- 3 -->
    <line x1="335" y1="200" x2="350" y2="200"/>
    <!-- 6 -->
    <line x1="200" y1="335" x2="200" y2="350"/>
    <!-- 9 -->
    <line x1="50" y1="200" x2="65" y2="200"/>
  </g>
  
  <!-- All 12 hour dots -->
  <g fill="#3a3a5a">
    <circle cx="200" cy="55" r="4"/>
    <circle cx="272" cy="72" r="3"/>
    <circle cx="328" cy="128" r="3"/>
    <circle cx="345" cy="200" r="4"/>
    <circle cx="328" cy="272" r="3"/>
    <circle cx="272" cy="328" r="3"/>
    <circle cx="200" cy="345" r="4"/>
    <circle cx="128" cy="328" r="3"/>
    <circle cx="72" cy="272" r="3"/>
    <circle cx="55" cy="200" r="4"/>
    <circle cx="72" cy="128" r="3"/>
    <circle cx="128" cy="72" r="3"/>
  </g>
  
  <!-- Both hands pointing to 12 - MIDNIGHT -->
  <!-- Hour hand -->
  <line x1="200" y1="200" x2="200" y2="90" stroke="#c0c0e0" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Minute hand -->
  <line x1="200" y1="200" x2="200" y2="60" stroke="#e0e0ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Center dot -->
  <circle cx="200" cy="200" r="8" fill="#fff" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="4" fill="#1a1a2e"/>
  
  <!-- "SUNDAY" fading out (left) -->
  <text x="70" y="205" font-family="system-ui, sans-serif" font-size="14" fill="#ff6666" opacity="0.4" text-anchor="middle">
    SUNDAY
  </text>
  <text x="70" y="220" font-family="system-ui, sans-serif" font-size="9" fill="#ff6666" opacity="0.3" text-anchor="middle">
    ✝ 23:59:59
  </text>
  
  <!-- "MONDAY" coming in (right) -->
  <text x="330" y="205" font-family="system-ui, sans-serif" font-size="14" fill="#66ff66" opacity="0.8" text-anchor="middle">
    MONDAY
  </text>
  <text x="330" y="220" font-family="system-ui, sans-serif" font-size="9" fill="#66ff66" opacity="0.6" text-anchor="middle">
    ★ 00:00:00
  </text>
  
  <!-- 00:00:00 display -->
  <rect x="120" y="280" width="160" height="40" rx="5" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="200" y="308" font-family="monospace" font-size="24" fill="#00ff88" text-anchor="middle" filter="url(#glow)">
    00:00:00
  </text>
  
  <!-- Date transition -->
  <text x="200" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">
    MAR 08 → MAR 09, 2026
  </text>
  
  <!-- Title -->
  <text x="200" y="25" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle" letter-spacing="3">
    THE MIDNIGHT DISPATCH
  </text>
</svg>
