<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <rect width="1200" height="1800" fill="#0b1020"/>
  <rect x="70" y="70" width="1060" height="1660" rx="36" fill="#141b31" stroke="#8bd3ff" stroke-opacity="0.35"/>
  <text x="120" y="190" fill="#eef2ff" font-family="Arial, sans-serif" font-size="88" font-weight="700">Quiet Yes Meter</text>
  <text x="120" y="250" fill="#a7b0d6" font-family="Arial, sans-serif" font-size="34">A pocket card for deciding whether an idea deserves a future.</text>

  <g transform="translate(120,360)">
    <text x="0" y="0" fill="#ffd28b" font-family="Arial, sans-serif" font-size="42" font-weight="700">1. Does this give energy or merely stimulation?</text>
    <text x="0" y="60" fill="#cbd3f5" font-family="Arial, sans-serif" font-size="28">A bright nervous system can impersonate a calling.</text>

    <text x="0" y="210" fill="#ffd28b" font-family="Arial, sans-serif" font-size="42" font-weight="700">2. What future maintenance rides in with it?</text>
    <text x="0" y="270" fill="#cbd3f5" font-family="Arial, sans-serif" font-size="28">Every artifact arrives carrying a broom, a bug report, and a calendar.</text>

    <text x="0" y="420" fill="#ffd28b" font-family="Arial, sans-serif" font-size="42" font-weight="700">3. What are the odds I still care in ten days?</text>
    <text x="0" y="480" fill="#cbd3f5" font-family="Arial, sans-serif" font-size="28">Think in likelihoods, not declarations.</text>

    <text x="0" y="630" fill="#ffd28b" font-family="Arial, sans-serif" font-size="42" font-weight="700">4. Who or what does this actually serve?</text>
    <text x="0" y="690" fill="#cbd3f5" font-family="Arial, sans-serif" font-size="28">A witness, a bruise, a question — not just the thrill of making.</text>

    <text x="0" y="840" fill="#ffd28b" font-family="Arial, sans-serif" font-size="42" font-weight="700">5. Would silence be a relief?</text>
    <text x="0" y="900" fill="#cbd3f5" font-family="Arial, sans-serif" font-size="28">Sometimes the honest contribution is the one that does not stir the mud.</text>
  </g>

  <rect x="120" y="1360" width="960" height="250" rx="24" fill="#0f1528" stroke="#95f0b5" stroke-opacity="0.35"/>
  <text x="160" y="1450" fill="#95f0b5" font-family="Arial, sans-serif" font-size="46" font-weight="700">Three outcomes</text>
  <text x="160" y="1525" fill="#eef2ff" font-family="Arial, sans-serif" font-size="34">High: build the smallest version tonight.</text>
  <text x="160" y="1585" fill="#eef2ff" font-family="Arial, sans-serif" font-size="34">Middle: leave a seed note, not a new obligation.</text>
  <text x="160" y="1645" fill="#eef2ff" font-family="Arial, sans-serif" font-size="34">Low: let it remain weather.</text>
</svg>
